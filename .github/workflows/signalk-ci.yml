name: SignalK Plugin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      format-check-command: npm run fmt:check
      # Desktop matrix only (Node 22/24) — replaces the plain `npm test` step
      # there with coverage + 80% thresholds. armv7 (fixed Node 20) always
      # uses test-command (default `npm test`), since the coverage-threshold
      # CLI flags below need Node >=22.8.
      coverage-command: npm run test:coverage
      # Pinned to releases whose bundled root CAs (NSS 3.131.1) drop the
      # distrusted eMudhra roots emSign ECC Root CA - G3, emSign Root CA - C1
      # and emSign ECC Root CA - C3 (the default is a bare '["22", "24"]').
      node-versions: '["22.23.4", "24.22.1"]'
