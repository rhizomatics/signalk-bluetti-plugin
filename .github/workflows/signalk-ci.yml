name: SignalK Plugin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      format-check-command: npm run fmt:check
      # Replaces the plain `npm test` step with coverage + 80% thresholds
      # (the threshold CLI flags need Node >=22.8). node-versions is left at the
      # default '["22", "24"]', which picks up each line's latest point release.
      coverage-command: npm run test:coverage
